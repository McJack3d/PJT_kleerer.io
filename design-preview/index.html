<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>n3gh. — trois directions pour l’accueil</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8e5dc;color:#171713;font-family:Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #151510;outline-offset:3px}.review{padding:20px 28px;border-bottom:1px solid #c8c5bb;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between}.review h1{font-size:16px;letter-spacing:-.03em;margin:0 0 5px}.review p{font-size:12px;color:#64635c;margin:0}.choices{display:flex;gap:5px}.choices button,.size button{border:1px solid #c7c5bd;background:transparent;min-height:42px;padding:8px 15px;font-size:12px;border-radius:3px}.choices button[aria-pressed=true],.size button[aria-pressed=true]{background:#171713;color:#f7f4eb;border-color:#171713}.size{display:flex;gap:5px}.description{margin:0;max-width:710px;font-size:13px;line-height:1.6}.below{padding:13px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.below a{color:inherit;font-size:12px;white-space:nowrap;text-underline-offset:4px}.stage{margin:0 20px 20px;min-height:calc(100svh - 155px);display:flex;justify-content:center}.frame{width:100%;border:1px solid #c8c5bb;background:#f7f4eb;transition:max-width .2s}.frame.mobile{max-width:390px;box-shadow:0 10px 45px #17171312}iframe{display:block;border:0;width:100%;height:1000px} @media(max-width:700px){.review{padding:16px;gap:16px}.review-title{width:100%}.choices{flex:1}.choices button{flex:1;padding:8px 12px}.size{display:none}.below{padding:12px 16px;align-items:flex-start}.description{font-size:12px}.stage{margin:0 0 16px}.frame{border-inline:0}.below a{font-size:11px}}
  </style>
</head>
<body>
  <header class="review"><div class="review-title"><h1>n3gh. / trois directions</h1><p>Propositions d’accueil · aperçu local</p></div><nav class="choices" aria-label="Choisir une proposition"><button type="button" data-design="a" aria-pressed="true">A · Essentiel</button><button type="button" data-design="b" aria-pressed="false">B · Éditorial</button><button type="button" data-design="c" aria-pressed="false">C · Index</button></nav><div class="size" aria-label="Largeur de l’aperçu"><button type="button" data-size="desktop" aria-pressed="true">Bureau</button><button type="button" data-size="mobile" aria-pressed="false">Mobile</button></div></header>
  <div class="below"><p class="description" id="description">Une entrée claire, des familles de produits accessibles en un clic. Le meilleur équilibre entre identité et accès rapide.</p><a href="a.html" id="open" target="_blank" rel="noopener">Ouvrir la proposition ↗</a></div>
  <main class="stage"><div class="frame" id="frame"><iframe src="a.html" id="preview" title="Proposition A — Essentiel"></iframe></div></main>
  <script>
    const details={a:['Essentiel','Une entrée claire, des familles de produits accessibles en un clic. Le meilleur équilibre entre identité et accès rapide.'],b:['Éditorial','Une signature plus expressive, avec deux accès immédiats : comparer les produits ou consulter les preuves.'],c:['Index','La priorité à la navigation : toutes les familles dans un index filtrable, sans étape intermédiaire.']};
    const preview=document.getElementById('preview');
    function resizeFrame(){try{preview.style.height=Math.max(760,preview.contentDocument.body.scrollHeight)+'px';}catch(e){}}
    document.querySelectorAll('[data-design]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.design;document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));preview.src=key+'.html';preview.title='Proposition '+key.toUpperCase()+' — '+details[key][0];document.getElementById('description').textContent=details[key][1];document.getElementById('open').href=key+'.html';history.replaceState(null,'','#'+key);}));
    document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('frame').classList.toggle('mobile',button.dataset.size==='mobile');setTimeout(resizeFrame,250);}));
    preview.addEventListener('load',()=>{resizeFrame();try{new ResizeObserver(resizeFrame).observe(preview.contentDocument.body);}catch(e){}});window.addEventListener('resize',resizeFrame);
    const initial=location.hash.slice(1);if(details[initial])document.querySelector('[data-design="'+initial+'"]').click();
  </script>
</body></html>
