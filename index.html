<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="description" content="n3gh. — independent, evidence-based health data. Makes supplement science available to individuals seeking advice or recommendations.">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://n3gh.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="n3gh.">
    <meta property="og:title" content="n3gh. — supplements, made clear">
    <meta property="og:description" content="Independent, evidence-based health data. An open Health & Compo Score and true price-per-active for EU/French supplements.">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "n3gh.",
      "url": "https://n3gh.com/",
      "description": "Independent, evidence-based health data: an open Health & Compo Score and true price-per-active for dietary supplements.",
      "knowsAbout": ["dietary supplements", "nutrition", "food additives", "health"],
      "sameAs": ["https://github.com/McJack3d/PJT_kleerer.io"]
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
      .langsw{position:absolute; top:0; right:0; display:flex; border:1px solid rgba(0,0,0,.18); border-radius:2px; overflow:hidden}
      .langsw button{background:none; border:none; padding:4px 8px; font:inherit; font-size:.7rem; cursor:pointer; color:rgba(0,0,0,.56); letter-spacing:.04em}
      .langsw button.on{background:#000; color:#f7f4eb}
      .site-header{position:relative}
      .site-foot{max-width:78ch; font-size:.68rem; line-height:1.6; color:rgba(0,0,0,.42)}
      .site-foot p+p{margin-top:6px}
      .site-foot a{color:inherit; text-decoration:none; border-bottom:1px solid rgba(0,0,0,.2)}
      .site-foot a:hover{color:var(--ink); border-bottom-color:var(--ink)}
    </style>
    <script src="/analytics.js" defer></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f7f4eb">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="n3gh.">
    <script src="/pwa.js" defer></script>
</head>
<body class="home">
  <header class="site-header">
    <h1 class="logo">n3gh<span class="logo-dot">.</span></h1>
    <span class="langsw" id="langsw" role="group" aria-label="Language">
      <button type="button" onclick="setLang('en')" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" onclick="setLang('fr')" data-lang="fr" aria-pressed="false">FR</button>
    </span>
  </header>
  <main class="home-main">
    <div class="molecular-background" aria-hidden="true">
      <img class="molecule-sleep" src="assets/molecules/melatonin.png" width="300" height="300" alt="" decoding="async">
      <img class="molecule-growth" src="assets/molecules/growth-hormone.jpeg" width="500" height="500" alt="" decoding="async">
      <img class="molecule-glycine" src="assets/molecules/glycine.png" width="300" height="300" alt="" decoding="async">
    </div>
    <section class="intro" aria-labelledby="motto">
      <h2 class="motto" id="motto">Health data, made available.</h2>
      <p class="intro-copy" id="intro-copy">Compare supplements. Understand the evidence. No sponsors, no affiliate links.</p>
      <nav class="home-actions" id="main-nav" aria-label="Main navigation">
        <a class="primary-link" href="compare/" id="compare-link">Compare supplements →</a>
        <a class="secondary-link" href="compare/evidence/" id="evidence-link">Explore the evidence →</a>
      </nav>
    </section>
  </main>
  <footer class="site-foot">
    <p>© 2026 n3gh.</p>
    <nav aria-label="Information" id="footer-nav">
      <a href="terms/" id="termslink">terms &amp; licences</a>
      <a href="bot/" id="botlink">crawler</a>
    </nav>
  </footer>
<script>
const LANG_KEY = "n3gh_lang";
const TXT = {
  en: {
    motto: "Health data, made available.",
    "intro-copy": "Compare supplements. Understand the evidence. No sponsors, no affiliate links.",
    "compare-link": "Compare supplements →",
    "evidence-link": "Explore the evidence →",
    termslink: "terms & licences", botlink: "crawler",
    desc: "n3gh. — independent health data. Compare supplements and explore the evidence. No sponsors, no affiliate links."
  },
  fr: {
    motto: "Les données de santé, accessibles.",
    "intro-copy": "Comparez les compléments. Comprenez les preuves. Sans sponsors ni liens affiliés.",
    "compare-link": "Comparer les compléments →",
    "evidence-link": "Explorer les preuves →",
    termslink: "conditions et licences", botlink: "robot",
    desc: "n3gh. — des données de santé indépendantes. Comparez les compléments et explorez les preuves. Sans sponsors ni liens affiliés."
  }
};
function detectLang(){
  try { const saved = localStorage.getItem(LANG_KEY); if (saved === "fr" || saved === "en") return saved; } catch(e){}
  return /^fr\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "en") ? "fr" : "en";
}
let LANG = detectLang();
function setLang(lang){
  if (!TXT[lang]) return;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyLang();
}
function applyLang(){
  document.documentElement.lang = LANG;
  for (const [id, text] of Object.entries(TXT[LANG])) {
    if (id === "desc") document.querySelector('meta[name="description"]').content = text;
    else document.getElementById(id).textContent = text;
  }
  document.getElementById("langsw").setAttribute("aria-label", LANG === "fr" ? "Langue" : "Language");
  document.getElementById("main-nav").setAttribute("aria-label", LANG === "fr" ? "Navigation principale" : "Main navigation");
  document.querySelectorAll("#langsw button").forEach(button => {
    const active = button.dataset.lang === LANG;
    button.classList.toggle("on", active);
    button.setAttribute("aria-pressed", String(active));
  });
}
applyLang();
</script>
</body>
</html>
