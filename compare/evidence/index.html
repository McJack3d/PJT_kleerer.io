<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="description" content="n3gh. — what supplements actually do, by need. Every claim graded on the trials behind it, with the participants counted and the EFSA claim shown separately.">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://n3gh.com/compare/evidence/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="n3gh.">
    <meta property="og:title" content="n3gh. — evidence, by need">
    <meta property="og:description" content="Which supplements have real evidence for sleep, stress, muscle, bone, heart, immunity, joints, skin, gut, energy and libido — graded on the trials, not the box.">
    <meta property="og:url" content="https://n3gh.com/compare/evidence/">
    <title>n3gh. — evidence · what the trials actually show</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f7f4eb">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="n3gh.">
    <script src="/analytics.js" defer></script>
    <script src="/pwa.js" defer></script>
<style>
  :root{
    --bg:#f7f4eb; --ink:#000000; --muted:rgba(0,0,0,.56); --faint:rgba(0,0,0,.38);
    --line:rgba(0,0,0,.18); --soft:rgba(0,0,0,.055);
    --gA:#1a7a3e; --gB:#74941f; --gC:#c49a00; --gD:#b93a17;
    --warn-bg:rgba(196,154,0,.10); --warn-line:rgba(196,154,0,.45); --warn-ink:#6f5703;
    --bot:#6b4fa3; --bot-bg:#efe9f9; --bot-line:#c9b8e8;
    --efsa:#1f4e79; --efsa-bg:rgba(31,78,121,.07);
    --boost:#1f6f78; --boost-bg:#e6f2f3; --boost-line:#b3d6d9;
    --pad:clamp(24px,5vw,56px);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; color:var(--ink); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased}
  ::selection{background:var(--ink); color:var(--bg)}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer}
  @keyframes rise{from{opacity:0; transform:translateY(10px)}}
  @keyframes breathe{50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  header{border-bottom:1px solid var(--line); background:var(--bg)}
  .hwrap{max-width:1180px; margin:0 auto; padding:18px var(--pad); display:flex; align-items:baseline; gap:14px}
  .logo-s{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; font-size:1.7rem; font-weight:bold; letter-spacing:-.04em; text-decoration:none; line-height:1}
  .logo-dot{animation:breathe 4s ease-in-out infinite; display:inline-block}
  .crumb{font-size:.8rem; color:var(--faint)}
  .hnav{margin-left:auto; display:flex; gap:4px; align-items:center}
  .hnav a{font-size:.8rem; color:var(--muted); padding:6px 10px; text-decoration:none}
  .hnav a:hover{color:var(--ink); text-decoration:underline}
  .langsw{display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; margin-left:6px}
  .langsw button{background:none; border:none; padding:4px 8px; font-size:.7rem; color:var(--muted); letter-spacing:.04em}
  .langsw button.on{background:var(--ink); color:var(--bg)}

  .hero{max-width:1180px; margin:0 auto; padding:56px var(--pad) 8px; animation:rise .7s ease .1s both}
  .hero h1{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; font-size:clamp(2.6rem,7vw,4.6rem); font-weight:bold; letter-spacing:-.04em; line-height:1}
  .hero .sub{font-size:1rem; max-width:62ch; margin-top:22px; line-height:1.7}
  .hero .sub b{font-weight:700}

  /* grade legend + the nutrient/botanical key */
  .legend{max-width:1180px; margin:0 auto; padding:26px var(--pad) 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; animation:rise .7s ease .2s both}
  .lg{border:1px solid var(--line); border-radius:2px; padding:12px 14px; font-size:.74rem; color:var(--muted); line-height:1.55; display:flex; gap:12px; align-items:flex-start}
  .lg .gb{flex:none}
  .lg b{color:var(--ink); display:block; font-size:.78rem; margin-bottom:2px}
  .gb{width:36px; height:36px; border-radius:2px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; font-weight:bold; font-size:18px; flex:none}
  .keyrow{max-width:1180px; margin:0 auto; padding:14px var(--pad) 0; display:flex; flex-wrap:wrap; gap:10px 18px; font-size:.72rem; color:var(--muted)}
  .keyrow .k{display:inline-flex; align-items:center; gap:7px}
  .sw{width:14px; height:14px; border-radius:2px; border:1px solid var(--line); display:inline-block}
  .sw.bot{background:var(--bot-bg); border-color:var(--bot-line)}
  .sw.efsa{background:var(--efsa-bg); border-color:var(--efsa)}

  /* needs bar */
  .needs{max-width:1180px; margin:0 auto; padding:22px var(--pad) 14px; position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; animation:rise .7s ease .25s both}
  .needs a{border:1px solid var(--line); border-radius:2px; padding:6px 13px; font-size:.78rem; color:var(--muted); text-decoration:none; transition:.15s}
  .needs a:hover{border-color:var(--ink); color:var(--ink)}

  main{max-width:1180px; margin:0 auto; padding:10px var(--pad) 40px}
  section.need{padding:38px 0 8px; border-bottom:1px solid var(--line); scroll-margin-top:84px}
  section.need:last-child{border-bottom:none}
  .need h2{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; font-size:clamp(1.6rem,3.4vw,2.2rem); font-weight:bold; letter-spacing:-.03em; line-height:1.05}
  .need .blurb{font-size:.86rem; color:var(--muted); max-width:70ch; margin:10px 0 22px; line-height:1.65}

  .entry{border:1px solid var(--line); border-radius:2px; padding:18px; margin-bottom:14px; background:var(--bg); display:grid; grid-template-columns:44px 1fr; gap:16px; animation:rise .5s ease both}
  .entry.bot{border-left:3px solid var(--bot-line)}
  .entry.boost{border-left:3px solid var(--boost-line)}
  .entry.boost .ename{color:var(--boost)}
  .chip.boost{border-color:var(--boost-line); color:var(--boost); background:var(--boost-bg)}
  .sw.boost{background:var(--boost-bg); border-color:var(--boost-line)}
  .entry .gb{width:44px; height:44px; font-size:20px; flex-direction:column}
  .entry .gb span{font-size:8px; font-weight:400; opacity:.9; margin-top:1px; font-family:ui-monospace,monospace}
  .etop{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px; margin-bottom:8px}
  .ename{font-size:1.02rem; font-weight:700}
  .entry.bot .ename{color:var(--bot)}
  .chip{font-size:.65rem; padding:2px 7px; border-radius:2px; border:1px solid var(--line); color:var(--muted)}
  .chip.bot{border-color:var(--bot-line); color:var(--bot); background:var(--bot-bg)}
  .cmp{margin-left:auto; font-size:.72rem; color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line)}
  .cmp:hover{color:var(--ink); border-bottom-color:var(--ink)}
  .effect{font-size:.88rem; line-height:1.65; max-width:78ch}
  .dose{font-size:.76rem; color:var(--muted); margin-top:9px}
  .dose b{color:var(--ink); font-weight:700}
  .studies{margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
  .studies h4{font-size:.66rem; text-transform:lowercase; letter-spacing:.08em; color:var(--faint); font-weight:400; margin-bottom:6px}
  .study{font-size:.74rem; color:var(--muted); line-height:1.55; padding:4px 0}
  .study b{color:var(--ink); font-weight:700}
  .study .n{color:var(--ink)}
  .study a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); margin-left:6px}
  .study a:hover{color:var(--ink); border-bottom-color:var(--ink)}
  .efsa{margin-top:12px; font-size:.74rem; line-height:1.55; padding:8px 11px; border-left:3px solid var(--efsa); background:var(--efsa-bg)}
  .efsa b{color:var(--efsa); font-weight:700}
  .safety{margin-top:12px; font-size:.76rem; line-height:1.6; padding:10px 12px; border:1px solid var(--warn-line); background:var(--warn-bg); color:var(--warn-ink); border-radius:2px}
  .safety b{display:block; margin-bottom:4px}
  .safety a{color:inherit; margin-right:10px; font-size:.7rem}
  .caveat{margin-top:10px; font-size:.76rem; color:var(--muted); line-height:1.6; max-width:78ch; font-style:italic}
  .empty{font-size:.74rem; color:var(--faint)}

  .method{max-width:78ch; margin:34px auto 0; padding:0 var(--pad); font-size:.8rem; color:var(--muted); line-height:1.7}
  .method h3{font-size:.7rem; text-transform:lowercase; letter-spacing:.08em; color:var(--faint); font-weight:400; margin:22px 0 8px; border-bottom:1px solid var(--line); padding-bottom:5px}
  .method p+p{margin-top:8px}

  footer{border-top:1px solid var(--line); margin-top:34px}
  .fwrap{max-width:1180px; margin:0 auto; padding:18px var(--pad) 20px; font-size:.75rem; color:var(--muted); line-height:1.7}
  .fdet summary{list-style:none; cursor:pointer; display:flex; gap:8px; align-items:baseline; padding:2px 0; max-width:72ch}
  .fdet summary::-webkit-details-marker{display:none}
  .fdet summary::before{content:"+"; opacity:.55; flex:none}
  .fdet[open] summary::before{content:"–"; opacity:1}
  .fdet summary:hover{color:var(--ink)}
  .fdet .fbody{margin-top:12px; max-width:72ch}
  .fdet .fbody p+p{margin-top:10px}
  .fwrap .row{display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; align-items:baseline}
  .fwrap .flogo{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; font-weight:bold; font-size:1rem; letter-spacing:-.04em; text-decoration:none}
  .fwrap a{color:var(--muted)}
  .fwrap a:hover{color:var(--ink)}
  @media (max-width:600px){ .entry{grid-template-columns:1fr} .entry .gb{width:40px;height:40px} .cmp{margin-left:0} }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a class="logo-s" href="../../">n3gh<span class="logo-dot">.</span></a>
    <span class="crumb" id="crumb">/ evidence</span>
    <nav class="hnav">
      <a href="/compare/" id="navCompare">compare</a>
      <a href="/compare/#methodology" id="navMethod">methodology</a>
      <span class="langsw" id="langsw">
        <button onclick="setLang('en')" data-lang="en" title="Show in English">EN</button>
        <button onclick="setLang('fr')" data-lang="fr" title="Afficher en français">FR</button>
      </span>
    </nav>
  </div>
</header>

<section class="hero">
  <h1 id="h1">evidence.</h1>
  <p class="sub" id="sub"></p>
</section>

<div class="legend" id="legend"></div>
<div class="keyrow" id="keyrow"></div>
<nav class="needs" id="needsbar"></nav>

<main id="main"></main>

<div class="method" id="method"></div>

<footer>
  <div class="fwrap">
    <details class="fdet">
      <summary><span id="fsum"></span></summary>
      <div class="fbody">
        <p id="fdisc"></p>
        <p id="frights"></p>
      </div>
    </details>
    <div class="row">
      <a class="flogo" href="../../">n3gh<span class="logo-dot">.</span></a>
      <span id="fmeta"></span>
    </div>
  </div>
</footer>

<script src="evidence.js"></script>
<script>
const LANG_KEY = "n3gh_lang";
const UI = {
  en: {
    crumb: "/ evidence", navCompare: "compare", navMethod: "methodology",
    sub: `What supplements <b>actually do</b>, by need — graded on the trials behind each claim, with participants counted. The <b>EFSA authorised claim</b> is shown separately from the evidence, because a regulator approving a sentence about a nutrient's role is not the same thing as a trial showing an outcome improved. <b>Not medical advice.</b>`,
    keyNutrient: "nutrient — has a reference intake and usually an EFSA limit",
    keyBot: "botanical — a plant extract, not a nutrient; no reference intake, no EFSA limit, no authorised claim",
    keyBoost: "sold to raise testosterone — plant, amino acid or mineral; graded on whether it did",
    keyEfsa: "EFSA authorised claim (Reg. 1924/2006) — regulator-approved wording, not outcome evidence",
    studies: "the studies", participants: "participants", compare: "compare products →",
    dose: "dose in the trials", noStudies: "no controlled trial meets the bar for a citation here — listed for the authorised claim and for what to expect, not for an effect.",
    efsaLabel: "EFSA", efsaNone: "no authorised health claim",
    methodTitle: "how this page is built", methodBody: [
      "Each row is one supplement for one need, and the grade belongs to that pair. Creatine is A for muscle and C for memory; the same fish oil is B for triglycerides and C for heart attacks. A grade is never a verdict on a molecule.",
      "Every number cites its source, with the participant count. Where a large trial contradicts a popular claim — vitamin D and fractures, fish oil and heart disease, collagen once you sort by who paid — the contradiction is the entry, not a footnote.",
      "Botanicals are shown in purple and scored apart on the comparator because they are not nutrients: there is no amount your body needs, no EFSA upper limit, and no authorised claim for any of them. Some have decent trial evidence anyway. One of them also has two European agencies advising against it, and that is written where the dose would otherwise be.",
      "Grades are editorial, and challengeable: the dataset is a single readable file, and every ruling on this site is open to correction by pointing at a better study."],
    fsum: "<b>Not medical advice.</b> Sources, licence and data rights — open the detail",
    fdisc: "<b>Not medical advice.</b> This page summarises published trials and regulator positions. It is not a recommendation to take anything, and it cannot know your history, your medication or your blood results. A supplement with strong evidence for a need is still a supplement you may not need. Talk to a healthcare professional before supplementing, especially if you are pregnant, on medication, or have a medical condition.",
    frights: `© 2026 n3gh. This dataset <b>CC BY-NC-SA 4.0</b> · code <b>AGPL-3.0</b>. Text-and-data-mining rights reserved (Dir. (EU) 2019/790 art. 4(3)) — see <a href="/terms/">terms</a>.`,
    fmeta: "evidence v1.0 · updated 2026-09-06 · grades are editorial and open to challenge",
  },
  fr: {
    crumb: "/ preuves", navCompare: "comparer", navMethod: "méthodologie",
    sub: `Ce que les compléments <b>font vraiment</b>, par besoin — noté sur les essais derrière chaque promesse, participants comptés. L'<b>allégation EFSA autorisée</b> est affichée à part des preuves, parce qu'un régulateur qui approuve une phrase sur le rôle d'un nutriment n'est pas la même chose qu'un essai montrant qu'un résultat s'améliore. <b>Ne constitue pas un avis médical.</b>`,
    keyNutrient: "nutriment — a un apport de référence et généralement une limite EFSA",
    keyBot: "plante — un extrait végétal, pas un nutriment ; aucun apport de référence, aucune limite EFSA, aucune allégation autorisée",
    keyBoost: "vendu pour augmenter la testostérone — plante, acide aminé ou minéral ; noté selon qu'il l'a fait",
    keyEfsa: "allégation EFSA autorisée (règl. 1924/2006) — formulation approuvée par le régulateur, pas une preuve de résultat",
    studies: "les études", participants: "participants", compare: "comparer les produits →",
    dose: "dose dans les essais", noStudies: "aucun essai contrôlé n'atteint le seuil pour être cité ici — listé pour l'allégation autorisée et pour savoir à quoi s'attendre, pas pour un effet.",
    efsaLabel: "EFSA", efsaNone: "aucune allégation santé autorisée",
    methodTitle: "comment cette page est construite", methodBody: [
      "Chaque ligne est un complément pour un besoin, et la note appartient à ce couple. La créatine est A pour le muscle et C pour la mémoire ; la même huile de poisson est B pour les triglycérides et C pour l'infarctus. Une note n'est jamais un verdict sur une molécule.",
      "Chaque chiffre cite sa source, avec le nombre de participants. Quand un grand essai contredit une promesse populaire — vitamine D et fractures, huile de poisson et cœur, collagène une fois trié selon qui a payé — la contradiction est l'entrée, pas une note de bas de page.",
      "Les plantes sont en violet et notées à part sur le comparateur parce que ce ne sont pas des nutriments : aucune quantité dont le corps a besoin, aucune limite supérieure EFSA, aucune allégation autorisée pour aucune d'elles. Certaines ont tout de même de bonnes preuves. L'une d'elles a aussi deux agences européennes qui la déconseillent, et c'est écrit là où la dose serait autrement.",
      "Les notes sont éditoriales, et contestables : le jeu de données est un seul fichier lisible, et chaque décision de ce site est ouverte à correction en pointant une meilleure étude."],
    fsum: "<b>Ne constitue pas un avis médical.</b> Sources, licence et droits sur les données — ouvrir le détail",
    fdisc: "<b>Ne constitue pas un avis médical.</b> Cette page résume des essais publiés et des positions de régulateurs. Ce n'est pas une recommandation de prendre quoi que ce soit, et elle ne peut connaître ni vos antécédents, ni vos traitements, ni vos analyses. Un complément bien étayé pour un besoin reste un complément dont vous n'avez peut-être pas besoin. Parlez-en à un professionnel de santé avant toute supplémentation, en particulier en cas de grossesse, de traitement en cours ou de pathologie.",
    frights: `© 2026 n3gh. Ce jeu de données <b>CC BY-NC-SA 4.0</b> · code <b>AGPL-3.0</b>. Droits de fouille de textes et de données réservés (dir. (UE) 2019/790 art. 4(3)) — voir les <a href="/terms/">conditions</a>.`,
    fmeta: "preuves v1.0 · mis à jour le 2026-09-06 · notes éditoriales, ouvertes à contestation",
  },
};
const GC = {A:"var(--gA)", B:"var(--gB)", C:"var(--gC)", D:"var(--gD)"};
let LANG = detectLang();
const L = v => (v && typeof v === "object" && "en" in v) ? (v[LANG] || v.en) : v;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN = n => n == null ? "" : n.toLocaleString(LANG === "fr" ? "fr" : "en");

function detectLang(){
  try { const v = localStorage.getItem(LANG_KEY); if (v === "fr" || v === "en") return v; } catch(e){}
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
  return /^fr\b/i.test(nav) ? "fr" : "en";
}
function setLang(l){ if (l !== "en" && l !== "fr") return; LANG = l; try{ localStorage.setItem(LANG_KEY, l); }catch(e){} render(); }

function entry(e){
  const sup = EVIDENCE.supplements[e.sup];
  const bot = sup.kind === "botanical";
  const boost = sup.kind === "booster";
  const U = UI[LANG];
  const safety = e.safety ? EVIDENCE.safety[e.safety] : null;
  return `<article class="entry${bot?" bot":""}${boost?" boost":""}">
    <div class="gb" style="background:${GC[e.grade]}"><span style="font-size:20px;font-family:Arial,Helvetica,sans-serif;font-weight:bold">${e.grade}</span><span>${esc(L(EVIDENCE.grades[e.grade].label))}</span></div>
    <div>
      <div class="etop">
        <span class="ename">${esc(L(sup.name))}</span>
        ${bot ? `<span class="chip bot">${LANG==="fr"?"plante":"botanical"}</span>` : ""}
        ${boost ? `<span class="chip boost">${LANG==="fr"?"« booster »":"\"booster\""}</span>` : ""}
        ${sup.cat ? `<a class="cmp" href="/compare/#cat=${sup.cat}">${esc(U.compare)}</a>` : ""}
      </div>
      ${safety ? `<div class="safety"><b>⚠ ${esc(L(safety.title))}</b>${esc(L(safety.body))}${safety.urls.length ? `<div style="margin-top:6px">${safety.urls.map(u=>`<a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.label)} ↗</a>`).join("")}</div>`:""}</div>` : ""}
      <p class="effect">${esc(L(e.effect))}</p>
      ${e.dose ? `<p class="dose"><b>${esc(U.dose)}:</b> ${esc(L(e.dose))}</p>` : ""}
      <div class="studies"><h4>${esc(U.studies)}</h4>
        ${e.studies.length ? e.studies.map(s => `<div class="study"><b>${esc(s.ref)}</b> · ${esc(L(s.design))}${s.n ? ` · <span class="n">${fmtN(s.n)} ${esc(U.participants)}</span>` : ""} — ${esc(L(s.finding))}${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">source ↗</a>` : ""}</div>`).join("")
                          : `<div class="empty">${esc(U.noStudies)}</div>`}
      </div>
      <div class="efsa"><b>${esc(U.efsaLabel)} —</b> ${e.efsa ? esc(L(e.efsa)) : esc(U.efsaNone)}</div>
      ${e.caveats ? `<p class="caveat">${esc(L(e.caveats))}</p>` : ""}
    </div>
  </article>`;
}

function render(){
  const U = UI[LANG];
  document.documentElement.lang = LANG;
  document.getElementById("crumb").textContent = U.crumb;
  document.getElementById("navCompare").textContent = U.navCompare;
  document.getElementById("navMethod").textContent = U.navMethod;
  document.getElementById("h1").textContent = LANG === "fr" ? "preuves." : "evidence.";
  document.getElementById("sub").innerHTML = U.sub;
  document.getElementById("legend").innerHTML = Object.entries(EVIDENCE.grades).map(([g, d]) =>
    `<div class="lg"><div class="gb" style="background:${GC[g]}">${g}</div><div><b>${g} · ${esc(L(d.label))}</b>${esc(L(d.def))}</div></div>`).join("");
  document.getElementById("keyrow").innerHTML =
    `<span class="k"><span class="sw"></span>${esc(U.keyNutrient)}</span>` +
    `<span class="k"><span class="sw bot"></span>${esc(U.keyBot)}</span>` +
    `<span class="k"><span class="sw boost"></span>${esc(U.keyBoost)}</span>` +
    `<span class="k"><span class="sw efsa"></span>${esc(U.keyEfsa)}</span>`;
  document.getElementById("needsbar").innerHTML = EVIDENCE.needs.map(n => `<a href="#${n.id}">${esc(L(n.name))}</a>`).join("");
  document.getElementById("main").innerHTML = EVIDENCE.needs.map(n => `
    <section class="need" id="${n.id}">
      <h2>${esc(L(n.name))}</h2>
      <p class="blurb">${esc(L(n.blurb))}</p>
      ${n.entries.map(entry).join("")}
    </section>`).join("");
  document.getElementById("method").innerHTML = `<h3>${esc(U.methodTitle)}</h3>` + U.methodBody.map(p => `<p>${esc(p)}</p>`).join("");
  document.getElementById("fsum").innerHTML = U.fsum;
  document.getElementById("fdisc").innerHTML = U.fdisc;
  document.getElementById("frights").innerHTML = U.frights;
  document.getElementById("fmeta").textContent = U.fmeta;
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
}
render();
</script>
</body>
</html>
